      container: 'map',
      style: 'mapbox://styles/emtzot01/cm6a8mjb5004g01qrd7cv07mq',
      center: INITIAL_LOC, 
      zoom: INITIAL_ZOOM
    });

    map.on('load', () => {
      // Add your vector source
      map.addSource("tracts", {    
            type: "vector",
            url: 'mapbox://communityscale.tracts-2020', //update to stream json source + join!!
            //data: "https://raw.githubusercontent.com/emtzot/mapSources/main/massachusetts_tracts.geojson",
            promoteId: "GEOID"
        })

        map.addSource("zips", {
            type: 'vector',
            url: 'mapbox://emtzot01.963cu3b9',
            promoteId: 'ZCTA5'
        })
   
        map.addSource("towns", {    
            type: "vector",
            url: "mapbox://emtzot01.4s34saee",
            promoteId: "TOWN_ID"
        })

        map.addSource("ctysds", {
            type: "vector",
            url: "mapbox://emtzot01.7fsgy5ln",
            promoteId: 'GEOID'
        })

            id: "overlay-top-anchor",
            type: "background",
            layout: {visibility: "none"}
        }, 
        "settlement-major-label", 
        "settlement-subdivision-label", 
        "settlement-minor-label"
    )

        map.addLayer({
                id: "tracts-layer",  
                type: "fill",
                source: "tracts",
                'source-layer': 'tracts',
                paint: {
                    'fill-color': communityScaleGray,
                    "fill-opacity": 0.6,
                    "fill-outline-color": "white",
                    "fill-outline-width": 1,
                    "fill-opacity": [
                        "case",
                        ["boolean", ["feature-state", "hover"], false],
                        0.95,
                        0.6
                ]},
                layout: {
                    visibility: "none"
                }
            }, "overlay-top-anchor"
        )

        fetch('https://raw.githubusercontent.com/emtzot/mapSources/main/mass_basicHNA_2023acs_250620.json')
                .then(response => response.json())
                .then(data => {
                    data.forEach(f => {
                    const id = f.GEOID.toString();
                    map.setFeatureState(
                        {
                        source: 'tracts',
                        sourceLayer: 'tracts',
                        id: id
                        },
                        {
                        medIncome: f["medIncome"],
                        pctRent30: f["pctRent30"],
                        pctOwned30: f["pctOwned30"]
                        }
                    )
                    });
                });


        fetch('https://raw.githubusercontent.com/emtzot/mapSources/main/CMRPC_RiskDisplacement_2023_ACS5Yr_Tract_250702.json')
                .then(response => response.json())
                .then(data => {

                        source: 'tracts',
                        sourceLayer: 'tracts',

            source: "tracts",
            'source-layer': 'tracts',
            paint: {

                    ["interpolate", 
                    ["linear"],
                    ["feature-state", "medIncome"],
                    29875,
                    medIncomePalette[0], 
                    59775,
                    medIncomePalette[1],
                    99625,
                    medIncomePalette[2],
                    139475,
                    medIncomePalette[3],
                    169400,
                    medIncomePalette[4]]],

                "fill-opacity": [
                   "case", ["==", ["feature-state", "medIncome"], null], 0,
                    ["case",
                    ["boolean", ["feature-state", "hover"], false],
                    0.95,
                    0.6
            ]]
             },
             layout: {
                visibility: "visible"

    )

            id: 'zip-currentZHVI',
            type: 'fill',
            source: 'zips',
            'source-layer': 'massachusetts_zips-4e09nn',
            paint: {
                "fill-color": [
                    "case", ["==", ["get", "zhvi25"], null], communityScaleGray,
                    ["interpolate", 
                    ["linear"],
                    ["get", "zhvi25"],

                    pricePalette[0], 
                    383500,
                    pricePalette[1],

                    735500,

)

const layerSelect = document.getElementById('layer-select');

const allLayers = [
  'tracts-medIncome',
  'tracts-pctCostBurdenedRenters',
  'tracts-pctCostBurdenedOwners',
  'zip-currentZHVI',
  'zip-chZHVI',
  'tracts-rdRace',
  'tracts-rdAge'
];

// ✅ Extract fill-color stops from layer expression
function getStopsFromLayer(layerId) {
  let expression = map.getPaintProperty(layerId, 'fill-color');

  // If it's a case statement, find the color scale inside
  if (Array.isArray(expression) && expression[0] === 'case') {
    // Search for 'interpolate' or 'step' inside the case
    expression = expression.find(sub => Array.isArray(sub) && (sub[0] === 'interpolate' || sub[0] === 'step'));
  }

  if (!Array.isArray(expression)) return [];

  const type = expression[0];
  if (type !== 'interpolate' && type !== 'step') return [];

  const stops = expression.slice(3); // [value1, color1, value2, color2, ...]
  const result = [];

  for (let i = 0; i < stops.length; i += 2) {
    result.push({
      value: stops[i],
      color: stops[i + 1]
    });
  }

  return result;
}


// ✅ Optional label formatter
function formatLegendLabel(value) {
  if (typeof value === 'number') {
    if (value < 1 && value > 0) return `${Math.round(value * 100)}%`;
    return `$${Math.round(value).toLocaleString()}`;
  }
  return value;
}

// ✅ Render legend from stops
function renderLegendFromStops(layerId) {
  const stops = getStopsFromLayer(layerId);

  if (!stops.length) {
    legendContent.innerHTML = `<p class="italic text-gray-500">No legend available</p>`;
    return;
  }

  legendContent.innerHTML = stops.map(stop => `
    <div class="flex items-center gap-2">
      <span class="w-4 h-4 inline-block rounded-sm" style="background-color: ${stop.color};"></span>
      <span>${formatLegendLabel(stop.value)}</span>
    </div>
  `).join('');
}

// ✅ On dropdown change
layerSelect.addEventListener('change', (e) => {
  const selected = e.target.value;

  allLayers.forEach(id => {
    if (map.getLayer(id)) {
      map.setLayoutProperty(id, 'visibility', id === selected ? 'visible' : 'none');
    }
  });

  renderLegendFromStops(selected);
});

// ✅ On map load
map.on('load', () => {
  const initialLayer = layerSelect.value;

  allLayers.forEach(id => {
    if (map.getLayer(id)) {
      map.setLayoutProperty(id, 'visibility', id === initialLayer ? 'visible' : 'none');
    }
  });

  renderLegendFromStops(initialLayer);
});
