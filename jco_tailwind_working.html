<script>
    const INITIAL_LOC = [-91.58, 41.67] 
    const INITIAL_ZOOM = 9.5 //set initial zoom (zoom levels 9-12 best for cities depending on size)(this is set to 13 to accomodate the tileset that will need to be uploaded via CLI)
    const communityScaleGray = "#425A70" //could replace with different accent color, I personally like this branding 
    const placeOfInterest = "Johnson County"
    const citiesOfInterest = [
                "Hills",
                "Lone Tree",
                "Oxford",
                "Shueyville",
                "Solon",
                "Swisher"
            ]
    const excludedCities = [
                "Iowa City",
                "Coralville",
                "North Liberty",
                "Tiffin",
                "University Heights"
            ]
    const medIncomePalette = [ //Sequential colorBrewer Purple/Red ramp
                '#f1eef6',
                '#d7b5d8',
                '#df65b0',
                '#dd1c77',
                '#980043'
            ]
    const cbRentersPalette = [ //Sequential colorBrewer GrnBlu ramp
                '#f6eff7',
                '#bdc9e1',
                '#67a9cf',
                '#1c9099',
                '#016c59'
            ]
    const cbOwnersPalette = [ //Sequential colorBrewer BluPur ramp
                '#edf8fb',
                '#b3cde3',
                '#8c96c6',
                '#8856a7',
                '#810f7c'
            ]
    const hhChangePalette = [ //Diverging colorBrewer PurGre ramp
                '#762a83',
                '#af8dc3',
                '#e7d4e8',
                '#f7f7f7',
                '#d9f0d3',
                '#7fbf7b',
                '#1b7837'
            ]

    const landValuePalette = [ //Sequential colorBrewer Blu ramp
                '#f1eef6',
                '#bdc9e1',
                '#74a9cf',
                '#2b8cbe',
                '#045a8d'
            ]
    const parcelValuePalette = [ //colorBrewer purples 
                '#f2f0f7',
                '#cbc9e2',
                '#9e9ac8',
                '#756bb1',
                '#54278f'
            ]

    const ownershipPalette = [ //categorical palette for tax credits -- update!!
                '#f2e22c',
                '#fa2a73',
                '#559428',
                '#79a8f2',
                '#e4ac28',
                '#a7d96d',
                '#8b63ba',
                '#bdc9e1'
            ]
    const landUsePalette = [
                "#24910a", //Agriculture
                "#d4f088", //Agricultural/residential
                "#fff8bf", //Residential
                "#ffa734", //Multifamily
                "#da6262", //Commercial
                "#b560bb", //Mixed use
                "#323052", //Industrial
                "#425A70", //Exempt
                "#bdc9e1" //Unknown
            ]

    //import * as turf from '@turf/turf';

    //mapboxgl.accessToken = 'pk.eyJ1IjoiZW10em90MDEiLCJhIjoiY20zZ2kyd3RpMDRnajJscHoyMG5neGJldyJ9.poXi4pgd2CoXKV2B4kg1Cw ';
    
    mapboxgl.accessToken = 'pk.eyJ1IjoiY29tbXVuaXR5c2NhbGUiLCJhIjoiY21hZ3Y4azlmMDU5YTJqb2NqbzRsa3psbSJ9.eJlBVHcMSB88Czl3ti2i5g';
    let map;
    const BASEMAP_STYLES = {
        gray: 'mapbox://styles/emtzot01/cm6a8mjb5004g01qrd7cv07mq',
        satellite: 'mapbox://styles/communityscale/cmc96uych026401s6577egc2r',
        lightSatellite: 'mapbox://styles/communityscale/cmcntrq2h00hp01qv4paqhpwx'
    };

    function initializeMap(styleKey = 'gray') {
      map = new mapboxgl.Map({
        container: 'map',
        style: BASEMAP_STYLES[styleKey],
        center: INITIAL_LOC,
        zoom: INITIAL_ZOOM
      });


    function adjustMapSize() { //idk if needed!!
        const sidebarWidth = document.getElementById('sidebar').width;
        const mapContainer = document.getElementById('map');
  
        mapContainer.style.marginLeft = `${sidebarWidth}px`;
        map.resize(); 
        }

    function addData (opacity = 0.6, visibleLayer = document.getElementById('layer-dropdown')) {
        map.addSource("tracts", {    
            type: "geojson",
            data: "https://raw.githubusercontent.com/CommunityScale/JohnsonCounty/main/iaBgs_selectCounties.geojson",
            promoteId: "GEOID"
        })
   
        map.addSource("cities", {    
            type: "geojson",
            data: "https://raw.githubusercontent.com/CommunityScale/JohnsonCounty/main/jc_politicalBoundaries.geojson",
            promoteId: "OBJECTID"
        })

        map.addSource("admin", {
            type: "geojson",
            data: "https://raw.githubusercontent.com/CommunityScale/JohnsonCounty/main/adminBoundaries_jcia.geojson",
            promoteId: "OBJECTID"
        })

        map.addSource("counties", {    
            type: "geojson",
            data: "https://raw.githubusercontent.com/CommunityScale/JohnsonCounty/main/iaCounties.geojson",
            promoteId: "GEOID"
        })

        map.addSource("villages",{
            type: "geojson",
            data: "https://raw.githubusercontent.com/CommunityScale/JohnsonCounty/main/villages_jco.geojson",
            promoteId: "VILLAGE"
        })

        map.addSource("parcels", {
            type: "geojson",
            data: 'https://raw.githubusercontent.com/CommunityScale/JohnsonCounty/main/uninc_parcels_jcia.geojson',
            //url: "mapbox://emtzot01.06wm5jay",
            promoteId: "PPN"
        })

        map.addSource("growthAreas", {
            type: "geojson",
            data: "https://raw.githubusercontent.com/CommunityScale/JohnsonCounty/main/targetedGrowthAreas_jcia.geojson",
            promoteId: "OBJECTID"
        })

        map.addSource("newPermits", {
            type: "geojson",
            data: "https://raw.githubusercontent.com/CommunityScale/JohnsonCounty/main/recentPermits_jcia.geojson",
            promoteId: "PPN"
        })

        map.addSource("manufacturedHomeParks", {
            type: "geojson",
            data: "https://raw.githubusercontent.com/CommunityScale/JohnsonCounty/main/mobileHomes_jcia.geojson",
            promoteId: "NAME"
        })

        map.addLayer({
                id: "admin-layer",  
                type: "fill",
                source: "admin",
                paint: {
                    'fill-color': communityScaleGray,
                    "fill-opacity": 0.6,
                    "fill-outline-color": "white",
                    "fill-outline-width": 1,
                    "fill-opacity": [
                        "case",
                        ["boolean", ["feature-state", "hover"], false],
                        0.95,
                        0.6
                ]},
                layout: {
                    visibility: "none"
                }
            },"road-label", 
            "settlement-major-label", 
            "settlement-subdivision-label", 
            "settlement-minor-label"
        )

        map.addLayer({
            id: "tracts-medIncome",  
            type: "fill",
            source: "tracts",
            paint: {
                "fill-color": [
                    "case", ["==", ["get", "medIncome"], null], communityScaleGray,
                    ["interpolate", 
                    ["linear"],
                    ["get", "medIncome"],
                    15000,
                    medIncomePalette[0], 
                    56000,
                    medIncomePalette[1],
                    73000,
                    medIncomePalette[2],
                    95000,
                    medIncomePalette[3],
                    130000,
                    medIncomePalette[4]]],
                "fill-outline-color": "white",
                "fill-opacity": [
                    "case", ["==", ["get", "medIncome"], null], 0.3,
                    ["case",
                    ["boolean", ["feature-state", "hover"], false],
                    0.95,
                    0.6
            ]]
             },
             layout: {
                visibility: "visible"
             }
        },
        "settlement-major-label", 
        "settlement-subdivision-label", 
        "settlement-minor-label"
    ) 


    map.addLayer({      
            id: "tracts-pctCostBurdenedRenters",  
            type: "fill",
            source: "tracts",
            paint: {
                "fill-color": [
                    "case", ["==", ["get", "pctRent30"], null], communityScaleGray,
                    ["interpolate", 
                    ["linear"],
                    ["get", "pctRent30"],
                    0,
                    cbRentersPalette[0], 
                    0.25,
                    cbRentersPalette[1],
                    0.50,
                    cbRentersPalette[2],
                    0.60,
                    cbRentersPalette[3],
                    0.75,
                    cbRentersPalette[4]]],
                "fill-outline-color": "white",
                "fill-opacity": [
                    "case", ["==", ["get", "pctRent30"], null], 0.3,
                    ["case",
                    ["boolean", ["feature-state", "hover"], false],
                    0.95,
                    0.6
            ]]
             },
             layout: {
                visibility: "none"
             }
        },
        "settlement-major-label", 
        "settlement-subdivision-label", 
        "settlement-minor-label"
    )
    

    map.addLayer({      
            id: "tracts-pctCostBurdenedOwners",  
            type: "fill",
            source: "tracts",
            paint: {
                "fill-color": [
                    "case", ["==", ["get", "pctOwned30"], null], communityScaleGray,
                    ["interpolate",
                    ["linear"],
                    ["get", "pctOwned30"],
                    0,
                    cbOwnersPalette[0],
                    0.11,
                    cbOwnersPalette[1], 
                    0.15,
                    cbOwnersPalette[2],
                    0.22,
                    cbOwnersPalette[3],
                    0.35,
                    cbOwnersPalette[4],
                ]],
                "fill-outline-color": "white",
                "fill-opacity": [
                    "case", ["==", ["get", "pctOwned30"], null], 0.3,
                    ["case",
                    ["boolean", ["feature-state", "hover"], false],
                    0.95,
                    0.6
            ]]
             },
             layout: {
                visibility: "none"
             }
        },
        "settlement-major-label", 
        "settlement-subdivision-label", 
        "settlement-minor-label"
    )

    map.addLayer({
                id: "parcels-landuse", //update with parcel types!!
                type: "fill",
                source: "parcels",
                //"source-layer": "parcels_jcia-7q1vz4", 
                paint: {
                    "fill-color": [
                        "match",
                        ["get", "PropClass"],
                        "A", landUsePalette[0],
                        "A,AD", landUsePalette[1],
                        "C", landUsePalette[4],
                        "C,M", landUsePalette[5],
                        "C,R", landUsePalette[5],
                        "E", landUsePalette[7],
                        "I", landUsePalette[6],
                        "R", landUsePalette[2],
                        "M", landUsePalette[3],
                        landUsePalette[8]
                    ],
                    "fill-outline-color": communityScaleGray,
                    "fill-opacity": [
                        "case",
                        ["boolean", ["feature-state", "hover"], false],
                        0.7,
                        0.5
                    ]
                },
                layout: {
                    visibility: "none"
                }
            }, 
            "settlement-major-label", 
            "settlement-subdivision-label", 
            "settlement-minor-label")

    map.addLayer({ 
            id: "parcels-pctLV",  
            type: "fill",
            source: "parcels",
            //"source-layer": "parcels_jcia-7q1vz4", 
            paint: {
                "fill-color": [
                    "case", ["==", ["get", "pctLandVal"], null], communityScaleGray,
                    ["interpolate", 
                    ["linear"],
                    ["get", "pctLandVal"],
                    0.03,
                    landValuePalette[4], 
                    0.15,
                    landValuePalette[3],
                    0.35,
                    landValuePalette[2],
                    0.65,
                    landValuePalette[1],
                    0.90,
                    landValuePalette[0]]],
                "fill-outline-color": "#545453",
                "fill-opacity": [
                    "case", ["==", ["get", "pctLandVal"], null], 0.3,
                    ["case",
                    ["boolean", ["feature-state", "hover"], false],
                    0.95,
                    0.6
            ]]
             },
             layout: {
                visibility: "none"
             }
        },"road-label", 
        "settlement-major-label", 
        "settlement-subdivision-label", 
        "settlement-minor-label"

// ✅ Extract fill-color stops from layer expression
function getStopsFromLayer(layerId) {
  let expression = map.getPaintProperty(layerId, 'fill-color');

  // If it's a case statement, find the color scale inside
  if (Array.isArray(expression) && expression[0] === 'case') {
    // Search for 'interpolate' or 'step' inside the case --> update if statement to account for matching 
    expression = expression.find(sub => Array.isArray(sub) && (sub[0] === 'interpolate' || sub[0] === 'step'));
  }

  if (!Array.isArray(expression)) return [];

  const type = expression[0];
  if (type !== 'interpolate' && type !== 'step') return [];

  const stops = expression.slice(3); // [value1, color1, value2, color2, ...]
  const result = [];

  for (let i = 0; i < stops.length; i += 2) {
    result.push({
      value: stops[i],
      color: stops[i + 1]
    });
  }

  return result;
}


//Optional label formatter --> need to fix for 0 values, what should happen to other values
function formatLegendLabel(value) {
  if (typeof value === 'number') {
    if (value < 1 && value > 0) return `${Math.round(value * 100)}%`;
    return `$${Math.round(value).toLocaleString()}`;
  }
  return value;
}

// ✅ Render legend from stops
function renderLegendFromStops(layerId) {
  const stops = getStopsFromLayer(layerId);

  if (!stops.length) {
    legendContent.innerHTML = `<p class="italic text-gray-500">No legend available</p>`;
    return;
  }

  legendContent.innerHTML = stops.map(stop => `
    <div class="flex items-center gap-2">
      <span class="w-4 h-4 inline-block rounded-sm" style="background-color: ${stop.color};"></span>
      <span>${formatLegendLabel(stop.value)}</span>
    </div>
  `).join('');
}

  const selected = e.target.value;

  allLayers.forEach(id => {
    if (map.getLayer(id)) {
      map.setLayoutProperty(id, 'visibility', id === selected ? 'visible' : 'none');
    }
  });

  renderLegendFromStops(selected);
});

    if (map.getLayer(id)) {

    }
  });

  renderLegendFromStops(initialLayer);
});

        ];

        hoverLayers.forEach(({ id, source }) => {
            map.on('mousemove', id, (e) => {
                if (e.features.length > 0) {
                    if (hoveredGeoId !== null) {
                        map.setFeatureState(
                            { source, id: hoveredGeoId },
                            { hover: false }
                        );
                    }
                    hoveredGeoId = e.features[0].id;
                    map.setFeatureState(
                        { source, id: hoveredGeoId },
                        { hover: true }
                    );
                }
            });

            map.on('mouseleave', id, () => {
                if (hoveredGeoId !== null) {
                    map.setFeatureState(
                        { source, id: hoveredGeoId },
                        { hover: false }
                    );
                }
                hoveredGeoId = null;
            });
        })};
